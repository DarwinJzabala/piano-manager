<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#355c4d">
  <title>Piano · Manager</title>
  <link rel="stylesheet" href="/styles.css">
  <script async crossorigin="anonymous" integrity="sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw" src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">P</span><span>Piano <b>Manager</b></span></div>
      <nav class="nav" id="nav">
        <a href="#dashboard" data-nav="dashboard">Panel</a>
        <a href="#estudiantes" data-nav="estudiantes">Estudiantes</a>
        <a href="#programa" data-nav="programa">Programa académico</a>
        <a href="#planificacion" data-nav="planificacion">Planificación</a>
        <a href="#clases" data-nav="clases">Clases</a>
        <a href="#tareas" data-nav="tareas">Tareas</a>
        <a href="#reportes" data-nav="reportes">Reportes</a>
        <a href="#historial" data-nav="historial">Historial</a>
        <a href="#ingresos" data-nav="ingresos">Ingresos</a>
        <a href="#ingresos-historial" data-nav="ingresos-historial">Historial de ingresos</a>
        <a href="#ingresos-reportes" data-nav="ingresos-reportes">Reportes de ingresos</a>
        <a href="#tarifas" data-nav="tarifas">Tarifas</a>
        <a href="#usuarios" data-nav="usuarios" hidden>Usuarios</a>
        <a href="#perfil" data-nav="perfil">Mi perfil</a>
        <a href="#respaldo" data-nav="respaldo">Respaldo</a>
      </nav>
      <div class="sidebar-foot" id="user-info"></div>
    </aside>
    <div class="nav-overlay" id="nav-overlay" hidden></div>

    <div class="content">
      <header class="topbar">
        <button class="menu-btn no-print" id="menu-btn" aria-label="Menú">☰</button>
        <div class="topbar-date" id="topbar-date"></div>
        <button class="btn primary no-print" id="quick-register">+ Registrar clase</button>
      </header>
      <main class="main" id="main"></main>
    </div>
  </div>

  <div class="auth-screen" id="auth-screen" hidden></div>

  <dialog class="modal" id="app-modal">
    <div class="modal-head">
      <h3 class="modal-title"></h3>
      <button type="button" class="icon-btn" data-close-modal aria-label="Cerrar">×</button>
    </div>
    <form class="modal-body" id="modal-form"></form>
    <div class="modal-foot">
      <button type="button" class="btn" data-close-modal>Cancelar</button>
      <button type="submit" class="btn primary" form="modal-form">Guardar</button>
    </div>
  </dialog>

  <div class="toast-wrap" id="toasts"></div>
  <div class="print-only" id="print-area"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
